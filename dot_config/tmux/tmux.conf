# Tmux config

# Better prefix (Ctrl+Space instead of Ctrl+b)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Enable mouse support
set -g mouse on

# Start windows/panes at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# True color support (important for themes)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Faster escape time (better for vim/neovim)
set -sg escape-time 10

# Increase scrollback
set -g history-limit 50000

# Default directory for new windows/panes
set -g default-command "cd ~/Code/Repositories/personal-projects && exec $SHELL"

# Status bar
set -g status-position bottom
set -g status-style 'bg=#2e3440 fg=#d8dee9'
set -g status-interval 5

# Left: tmux indicator + session + git branch (if in repo)
set -g status-left '#[fg=#88c0d0,bold]tmux  #[fg=#d8dee9]#S  #[fg=#a3be8c]#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null) '
set -g status-left-length 80

# Right: battery + time + date
set -g status-right '#[fg=#81a1c1]#(~/.config/tmux/lang-version.sh #{pane_current_path})  #[fg=#ebcb8b]#(~/.config/tmux/battery.sh) #[fg=#d8dee9]  %H:%M  %d-%b '
set -g status-right-length 70

# Auto-rename windows to current directory
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'

# Window status (minimal)
setw -g window-status-format '#[fg=#4c566a] #I:#{b:pane_current_path} '
setw -g window-status-current-format '#[fg=#88c0d0,bold] #I:#{b:pane_current_path} '
setw -g window-status-separator ''

# Active pane visual indicators
set -g pane-border-style 'fg=#4c566a'
set -g pane-active-border-style 'fg=#88c0d0 bold'

# Dim inactive panes (slightly darker background)
set -g window-style 'bg=#2e3440'
set -g window-active-style 'bg=#3b4252'

# Easy config reload
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Intuitive splits (\ for vertical, - for horizontal)
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate panes with arrow keys (more intuitive)
bind Left select-pane -L
bind Down select-pane -D
bind Up select-pane -U
bind Right select-pane -R

# Also keep vim keys as alternative
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Plugin Manager (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'alexwforsythe/tmux-which-key'

# Initialize TPM via bootstrap (auto-installs if missing)
run '~/.config/tmux/bootstrap.sh'
