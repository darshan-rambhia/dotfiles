# Topgrade configuration
# https://github.com/topgrade-rs/topgrade

[misc]
# Don't ask for confirmation
assume_yes = true
# Never prompt "Retry? (y)es/(N)o/(s)hell/(q)uit" on a failed step
ask_retry = false
# Cleanup after updates
cleanup = true
# Skip items that need sudo
#no_sudo = true
# Disable steps you don't use
disable = [
  "tmux", "helm", "containers", "chezmoi",
  # softwareupdate requires a real TTY, always fails with "Not a terminal" in topgrade
  "system",
  # system Ruby 2.6 is too old for most gems; these fail every time
  "gem", "ruby_gems",
  # pnpm PATH not set in topgrade's environment; run manually when needed
  "pnpm",
  # npm (node) global update breaks on @openai/.codex-* temp packages from nvm context
  "node",
  # microsoft.tye is deprecated and no longer in NuGet feeds
  "dotnet",
  # uv --all fails if any single tool has a missing wheel (bt-mem etc); use custom command instead
  "uv",
  # IntelliJ IDEA not installed on this machine
  "jetbrains_idea",
  # replaced by the "Brew casks" custom command below, which excludes visual-studio-code
  "brew_cask",
]

[brew]
# Greedy cask upgrade (upgrade even if auto-update is enabled)
greedy_cask = true

[commands]
# Custom commands to run
# Greedy cask upgrade, minus visual-studio-code. The vscode cask carries
# `uninstall launchctl: com.microsoft.VSCode.ShipIt`, and Homebrew probes the
# launchd *system* domain with sudo unconditionally (abstract_uninstall.rb,
# `booleans = [false, true]`) even though that service does not exist here --
# which pops a Password: prompt mid-run. vscode auto-updates itself, so skipping
# it loses nothing. xargs -I{} is deliberate: it runs zero times on empty input,
# whereas a bare `xargs brew upgrade --cask --greedy` would upgrade everything.
"Brew casks" = "brew outdated --cask --greedy --quiet | grep -vx 'visual-studio-code' | xargs -I{} brew upgrade --cask --greedy {}"
"uv tools" = "uv tool list 2>/dev/null | awk '/^[a-z]/{print $1}' | while read t; do uv tool upgrade \"$t\" 2>/dev/null || echo \"skipped $t\"; done"
"Clean npm staging" = "find $(npm root -g) -maxdepth 1 -name '.*' -type d -exec rm -rf {} + 2>/dev/null || true"
"Chezmoi update" = "rm -f ~/.local/share/chezmoi/.git/objects/info/commit-graphs/commit-graph-chain.lock; chezmoi update --apply=false"
"Zinit update" = "zsh -ic 'zinit update --all'"
"Brew doctor" = "brew doctor || true"
"Save Brewfile" = "brew bundle dump --describe --force --file=~/.config/homebrew/Brewfile"
"Clear npm cache" = "/opt/homebrew/bin/npm cache clean --force"
"Git GC repos" = "git -C ~/.local/share/chezmoi gc --quiet && find ~/Code/Repositories -name .git -type d -exec dirname {} \\; 2>/dev/null | xargs -I{} git -C {} gc --quiet"
"Chezmoi re-add" = "chezmoi re-add"
"Chezmoi push" = "chezmoi git -- add -A && chezmoi git -- diff --cached --quiet || (chezmoi git -- commit -m 'Dotfiles updated by topgrade' && chezmoi git -- push)"

[git]
# Update git repos
repos = [
  "~/.local/share/zinit/plugins/*"
]

# Skip these steps if they cause issues
[linux]
# Skip snap, flatpak on macOS
