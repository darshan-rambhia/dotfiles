# Topgrade configuration
# https://github.com/topgrade-rs/topgrade

[misc]
# Don't ask for confirmation
assume_yes = false
# Cleanup after updates
cleanup = true
# Skip items that need sudo
#no_sudo = true
# Disable steps you don't use
disable = [
  "tmux", "helm", "containers", "chezmoi",
  # softwareupdate requires a real TTY, always fails with "Not a terminal" in topgrade
  "system",
  # system Ruby 2.6 is too old for most gems; these fail every time
  "gem", "rubygems",
  # pnpm PATH not set in topgrade's environment; run manually when needed
  "pnpm",
  # npm global update breaks on @openai/.codex-* temp packages from nvm context
  "npm",
  # oh-my-zsh gets SIGINT; the custom "Zinit update" command handles zsh plugin updates
  "oh_my_zsh",
]

[brew]
# Greedy cask upgrade (upgrade even if auto-update is enabled)
greedy_cask = true

[commands]
# Custom commands to run
"Clean npm staging" = "find $(npm root -g) -maxdepth 1 -name '.*' -type d -exec rm -rf {} + 2>/dev/null || true"
"Chezmoi update" = "chezmoi update --apply=false"
"Zinit update" = "zsh -ic 'zinit update --all'"
"Brew doctor" = "brew doctor || true"
"Save Brewfile" = "brew bundle dump --describe --force --file=~/.config/homebrew/Brewfile"
"Clear npm cache" = "/opt/homebrew/bin/npm cache clean --force"
"Git GC repos" = "git -C ~/.local/share/chezmoi gc --quiet && find ~/Code/Repositories -name .git -type d -exec dirname {} \\; 2>/dev/null | xargs -I{} git -C {} gc --quiet"
"Chezmoi re-add" = "chezmoi re-add"
"Chezmoi push" = "chezmoi git -- add -A && chezmoi git -- diff --cached --quiet || (chezmoi git -- commit -m 'Dotfiles updated by topgrade' && chezmoi git -- push)"

[git]
# Update git repos
repos = [
  "~/.local/share/zinit/plugins/*"
]

# Skip these steps if they cause issues
[linux]
# Skip snap, flatpak on macOS
